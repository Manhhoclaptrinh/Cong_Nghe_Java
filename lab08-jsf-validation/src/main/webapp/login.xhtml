<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

<h:head>

    <title>Đăng nhập</title>

</h:head>

<h:body>

    <h2>Đăng nhập hệ thống</h2>

    <h:messages
        style="color:red"/>

    <h:form>

        <p>

            Tài khoản:

            <br/>

            <h:inputText
                value="#{loginBean.username}"
                required="true"
                requiredMessage="Vui lòng nhập tài khoản"/>

        </p>

        <p>

            Mật khẩu:

            <br/>

            <h:inputSecret
                value="#{loginBean.password}"
                required="true"
                requiredMessage="Vui lòng nhập mật khẩu"/>

        </p>

        <h:commandButton
            value="Đăng nhập"
            action="#{loginBean.login}"/>

    </h:form>

    <p>
        Tài khoản demo: <b>admin</b>
    </p>

    <p>
        Mật khẩu demo: <b>123456</b>
    </p>

</h:body>

</html>
